name: Bug report
description: Report reproducible incorrect behavior in ABX
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not disclose vulnerabilities or credentials here. Use the private process in SECURITY.md.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Contracts
        - SDK
        - CLI or agent skill
        - Indexer or token API
        - Storage
        - Effects
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0-alpha.x or commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands and redacted output. Never paste an environment file or secret.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
