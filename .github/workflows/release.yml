# Publish @artblocks/abx-* packages through Changesets and npm trusted publishing.
#
# OIDC requirements: keep pnpm pinned in package.json, use Node >=22.14, and do not set
# setup-node's `registry-url` (it creates an npmrc that interferes with pnpm's token exchange).
# Packages must configure this repository as a trusted publisher on npmjs.com.
#
# The repository is in Changesets alpha mode. Before a stable release, run `pnpm changeset pre exit`.
# Prereleases currently land on `latest`; once a stable line exists, publish prereleases with the
# `alpha` dist-tag instead.
name: Release

on:
  push:
    branches: [main]

# Never run two releases at once (a second push waits rather than racing a publish).
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push the Version Packages branch + tags
  pull-requests: write # open/update the Version Packages PR
  id-token: write # mint the OIDC token npm trades for a short-lived publish token

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Changesets needs full history to diff against baseBranch

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # >= 22.14, required for OIDC trusted publishing
          cache: pnpm
          # NOTE: intentionally no `registry-url` — see the OIDC note in the header.

      - run: pnpm install --frozen-lockfile

      - name: Create Release PR or publish to npm
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm ci:version # bump versions + regenerate CHANGELOGs (into the PR)
          # `changeset publish` emits the package/version records the action uses to create tags and
          # GitHub Releases. It delegates each package to pnpm, which performs the OIDC publish.
          publish: pnpm ci:publish
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN / NODE_AUTH_TOKEN — auth is OIDC trusted publishing.
